<div class="absolute inset-1.5 rounded-full bg-gradient-to-br from-tertiary-fixed-dim/20 to-primary-container/10 blur-md"></div>
<div class="relative w-20 h-20 rounded-full bg-gradient-to-tr from-primary-container via-[#c85a32] to-tertiary-fixed-dim shadow-lg shadow-primary-container/25 flex items-center justify-center cursor-pointer transition-transform duration-700 ease-out active:scale-95" id="maia-orb">
<div class="w-16 h-16 rounded-full bg-gradient-to-b from-white/30 to-transparent opacity-60"></div>
<div class="absolute inset-0 rounded-full bg-[radial-gradient(circle_at_30%_30%,rgba(255,255,255,0.45),transparent_60%)]"></div>
</div>
</div>
<div class="space-y-1.5 max-w-xs">

<p class="font-body-md text-body-md text-on-surface-variant font-normal leading-relaxed">
        I’m here whenever you’d like to talk. What’s on your mind today?
      </p>
</div>
<div class="mt-4 inline-flex items-center gap-1.5 bg-surface-container-low px-3 py-1 rounded-full">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-caption text-caption text-secondary font-medium">Listening locally · All models ready</span>
</div>
</div>
<section class="flex flex-col gap-2.5 w-full my-2">
<button class="group w-full text-left bg-surface-container-lowest rounded-xl p-3.5 transition-all duration-200 active:scale-[0.99] hover:bg-surface-container-low flex items-center gap-3.5 shadow-sm shadow-on-surface/5" onclick="selectPrompt('How was your day? Reflecting on work, energy, and highlights...')" type="button">

</div>
<div class="flex-1 min-w-0">

        </span>
<span class="block font-caption text-caption text-on-surface-variant truncate mt-0.5">
          Reflect on work, energy, and highlights
        </span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[18px] group-hover:translate-x-0.5 group-hover:text-on-surface transition-all">

      </span>
</button>
<button class="group w-full text-left bg-surface-container-lowest rounded-xl p-3.5 transition-all duration-200 active:scale-[0.99] hover:bg-surface-container-low flex items-center gap-3.5 shadow-sm shadow-on-surface/5" onclick="selectPrompt('There is something on my mind. Can we untangle this thought?')" type="button">
<div class="w-10 h-10 rounded-lg bg-secondary-container flex items-center justify-center flex-shrink-0 text-secondary group-hover:bg-secondary group-hover:text-on-secondary transition-colors">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<div class="flex-1 min-w-0">
<span class="block font-label-md text-label-md text-on-surface font-semibold group-hover:text-secondary transition-colors">
          Something on your mind
        </span>
<span class="block font-caption text-caption text-on-surface-variant truncate mt-0.5">
          Untangle thoughts or talk through a decision
        </span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[18px] group-hover:translate-x-0.5 group-hover:text-on-surface transition-all">
        chevron_right
      </span>
</button>
<button class="group w-full text-left bg-surface-container-lowest rounded-xl p-3.5 transition-all duration-200 active:scale-[0.99] hover:bg-surface-container-low flex items-center gap-3.5 shadow-sm shadow-on-surface/5" onclick="selectPrompt('Let us plan tomorrow. Help me set intentions and focus.')" type="button">
<div class="w-10 h-10 rounded-lg bg-tertiary-fixed flex items-center justify-center flex-shrink-0 text-tertiary group-hover:bg-tertiary-container group-hover:text-on-tertiary-container transition-colors">

</div>
<div class="flex-1 min-w-0">
<span class="block font-label-md text-label-md text-on-surface font-semibold group-hover:text-tertiary transition-colors">

        </span>
<span class="block font-caption text-caption text-on-surface-variant truncate mt-0.5">
          Set intentions and prioritize what matters
        </span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[18px] group-hover:translate-x-0.5 group-hover:text-on-surface transition-all">
        chevron_right
      </span>
</button>
</section>
<div class="w-full mt-4 flex flex-col gap-2">
<div class="relative w-full bg-surface-container-lowest rounded-full p-1.5 flex items-center shadow-sm shadow-on-surface/5 transition-all focus-within:shadow-md">
<button aria-label="Start voice reflection" class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all flex-shrink-0 active:scale-90" id="voice-trigger" type="button">
<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
<input class="flex-1 min-w-0 bg-transparent px-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="prompt-input" onkeydown="handleInputKey(event)" placeholder="Type a thought, or tap the mic..." type="text"/>
<button aria-label="Send message" class="w-10 h-10 rounded-full bg-primary-container text-on-primary flex items-center justify-center flex-shrink-0 shadow-sm transition-transform active:scale-95 hover:opacity-90" id="send-btn" onclick="sendMessage()" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_upward</span>
</button>
</div>
<div class="flex items-center justify-center gap-1.5 pt-1 text-center">
<span class="material-symbols-outlined text-[14px] text-outline">lock</span>
<span class="font-caption text-[11px] text-outline font-medium tracking-tight">
        Encrypted on-device · Zero data leaves this phone
      </span>
</div>
</div>
</div>
<script>
  function selectPrompt(text) {
    const input = document.getElementById('prompt-input');
    if (input) {
      input.value = text;
      input.focus();
    }
  }

  function sendMessage() {
    const input = document.getElementById('prompt-input');
    if (!input || !input.value.trim()) return;
    
    const orb = document.getElementById('maia-orb');
    if (orb) {
      orb.classList.add('scale-110');
      setTimeout(() => orb.classList.remove('scale-110'), 400);
    }
    
    input.value = '';
    input.placeholder = 'Maia is thinking locally...';
    setTimeout(() => {
      input.placeholder = 'Type a thought, or tap the mic...';
    }, 1800);
  }

  function handleInputKey(e) {
    if (e.key === 'Enter') {
      sendMessage();
    }
  }

  const voiceBtn = document.getElementById('voice-trigger');
  if (voiceBtn) {
    let recording = false;
    voiceBtn.addEventListener('click', () => {
      recording = !recording;
      const orb = document.getElementById('maia-orb');
      if (recording) {
        voiceBtn.classList.add('bg-primary-container', 'text-on-primary');
        voiceBtn.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
        if (orb) orb.classList.add('animate-bounce');
      } else {
        voiceBtn.classList.remove('bg-primary-container', 'text-on-primary');
        voiceBtn.classList.add('bg-surface-container-low', 'text-on-surface-variant');
        if (orb) orb.classList.remove('animate-bounce');
      }
    });
  }
</script></main><div class="fixed bottom-0 w-full z-50 pointer-events-none pb-safe"><div class="max-w-[480px] mx-auto px-margin pb-4 flex justify-center"><nav class="pointer-events-auto h-14 bg-surface-container-lowest/90 backdrop-blur-xl rounded-full px-1.5 flex items-center shadow-[0_8px_24px_rgba(36,29,21,0.06),0_2px_6px_rgba(36,29,21,0.03)]" data-active-classes="bg-primary-container/10 text-primary font-semibold"><a class="flex items-center gap-1.5 h-11 px-4 rounded-full text-on-surface-variant hover:text-on-surface transition-all" data-path="talk" href="#"><span class="material-symbols-outlined text-[20px]">chat_bubble</span><span class="font-label-md text-label-md">Talk</span></a><a class="flex items-center gap-1.5 h-11 px-4 rounded-full text-on-surface-variant hover:text-on-surface transition-all" data-path="remembers" href="#"><span class="material-symbols-outlined text-[20px]">auto_awesome</span><span class="font-label-md text-label-md">Remembers</span></a><a class="flex items-center gap-1.5 h-11 px-4 rounded-full text-on-surface-variant hover:text-on-surface transition-all" data-path="insights" href="#"><span class="material-symbols-outlined text-[20px]">ssid_chart</span><span class="font-label-md text-label-md">Insights</span></a></nav></div></div>
