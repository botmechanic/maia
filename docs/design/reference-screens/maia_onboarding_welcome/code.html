<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary": "#774a00", "on-tertiary-container": "#ffecd9", "on-background": "#211a12", "surface-bright": "#fff8f4", "secondary-container": "#d8e8c6", "primary": "#903820", "on-error-container": "#93000a", "secondary-fixed-dim": "#bcccab", "on-tertiary-fixed-variant": "#653e00", "tertiary-fixed": "#ffddb8", "on-surface-variant": "#56423d", "on-secondary-fixed": "#131f0a", "outline-variant": "#dcc0ba", "on-secondary-fixed-variant": "#3d4b32", "on-tertiary": "#ffffff", "background": "#fff8f4", "on-surface": "#211a12", "secondary": "#556348", "on-primary-container": "#ffeae5", "inverse-primary": "#ffb5a1", "primary-container": "#af4f35", "surface-dim": "#e6d8cb", "on-primary-fixed": "#3c0800", "on-secondary-container": "#5a694e", "on-primary-fixed-variant": "#7e2b14", "inverse-surface": "#372f26", "tertiary-container": "#93621b", "on-primary": "#ffffff", "on-tertiary-fixed": "#2a1700", "surface": "#fff8f4", "surface-container-lowest": "#ffffff", "on-secondary": "#ffffff", "error": "#ba1a1a", "inverse-on-surface": "#fdeee1", "primary-fixed-dim": "#ffb5a1", "surface-tint": "#9d4229", "surface-container-low": "#fff1e5", "surface-container": "#faebde", "surface-container-highest": "#eee0d3", "tertiary-fixed-dim": "#fabb6c", "outline": "#89726c", "primary-fixed": "#ffdbd1", "error-container": "#ffdad6", "secondary-fixed": "#d8e8c6", "on-error": "#ffffff", "surface-container-high": "#f4e6d9", "surface-variant": "#eee0d3" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "margin": "1.25rem", "space-xs": "0.25rem", "space-md": "1rem", "gutter": "1rem", "space-xl": "2rem", "space-lg": "1.5rem" }, "fontFamily": { "body-md": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "numeric-metric": ["Plus Jakarta Sans"], "caption": ["Plus Jakarta Sans"] }, "fontSize": { "body-md": ["15px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "headline-xl-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "body-lg": ["17px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-xl": ["34px", { "lineHeight": "42px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }], "numeric-metric": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "caption": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }] } } } }</script><style>@layer base { .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="min-h-full bg-background text-on-surface font-body-md text-body-md antialiased flex flex-col items-center"><div class="w-full max-w-[480px] min-h-screen flex flex-col relative px-margin pt-safe pb-safe"><main class="flex-1 flex flex-col w-full bg-background"><div class="flex flex-col w-full justify-between min-h-[calc(100vh-4rem)] select-none">
<!-- Subtle Top Anchor / Minimalist Header Space -->
<div class="w-full flex items-center justify-between pt-2">
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant font-caption text-caption">
<span class="material-symbols-outlined text-[14px] leading-none" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="tracking-wider uppercase text-[11px] font-semibold">Offline Core</span>
</div>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors py-1 px-2 rounded-lg" type="button">
      Skip
    </button>
</div>
<!-- Center Sanctuary: Breathing Mathematical Geometric Orb & Core Narrative -->
<div class="flex flex-col items-center justify-center text-center my-auto px-2">
<!-- Breathing Organic Entity Orb -->
<div class="relative flex items-center justify-center mb-8">
<!-- Ambient Outer Warm Halo -->
<div class="absolute w-36 h-36 rounded-full transition-all duration-1000 ease-in-out opacity-45 pointer-events-none" id="maia-halo" style="background: radial-gradient(circle, rgba(224, 164, 88, 0.45) 0%, rgba(175, 79, 53, 0.15) 55%, transparent 75%); filter: blur(14px);"></div>
<!-- Core Radiance Orb -->
<div class="relative w-20 h-20 rounded-full transition-transform duration-700 ease-out cursor-pointer active:scale-95" id="maia-orb" style="background: radial-gradient(circle at 35% 30%, #E0A458 0%, #C97242 45%, #AF4F35 85%, #8A331E 100%); box-shadow: 0 10px 28px rgba(175, 79, 53, 0.28), inset 0 1px 2px rgba(255, 255, 255, 0.45);">
<!-- Specular Glimmer Point -->
<div class="absolute top-2.5 left-3.5 w-3.5 h-2 rounded-full bg-surface-bright opacity-40 rotate-[-25deg] blur-[0.5px]"></div>
</div>
</div>
<!-- Editorial Typography Block -->
<div class="space-y-3 max-w-[320px]">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">
        Hi, I’m Maia
      </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
        A companion that lives only on your phone.
      </p>
</div>
<!-- Micro Interaction Prompt (Reveals on tap) -->
<div class="h-6 mt-4 flex items-center justify-center transition-opacity duration-500 opacity-0 text-caption font-caption text-secondary" id="orb-hint">
<span class="flex items-center gap-1">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-secondary"></span>
        Encrypted entirely to this silicon
      </span>
</div>
</div>
<!-- Bottom Ergonomics & Action Sequence -->
<div class="flex flex-col items-center w-full space-y-5 pb-6">
<!-- 3-Dot Minimalist Page Indicator -->
<div aria-label="Onboarding Progress" class="flex items-center justify-center gap-2" role="tablist">
<!-- Active Pill Dot -->
<div aria-label="Step 1 of 3 (Current)" class="w-6 h-2 rounded-full bg-primary-container transition-all duration-300"></div>
<!-- Inactive Soft Hairline Dots -->
<div aria-label="Step 2 of 3" class="w-2 h-2 rounded-full bg-surface-container-highest transition-all duration-300"></div>
<div aria-label="Step 3 of 3" class="w-2 h-2 rounded-full bg-surface-container-highest transition-all duration-300"></div>
</div>
<!-- Primary Action Target -->
<div class="w-full">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary font-label-md text-label-md font-semibold tracking-wide flex items-center justify-center gap-2 shadow-sm active:scale-[0.98] transition-transform duration-150 focus:outline-none" id="get-started-btn" type="button">
<span>Get started</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Trust Guarantee Microtext -->
<div class="flex items-center justify-center gap-1.5 text-on-surface-variant/70 font-caption text-caption tracking-tight">
<span>No cloud</span>
<span class="text-[10px] opacity-40">•</span>
<span>No account required</span>
</div>
</div>
</div>
<script>
  (function () {
    const orb = document.getElementById('maia-orb');
    const halo = document.getElementById('maia-halo');
    const hint = document.getElementById('orb-hint');
    const startBtn = document.getElementById('get-started-btn');

    if (!orb || !halo) return;

    let time = 0;
    let isBreathing = true;

    // Organic breath cycle algorithm for Maia's entity orb
    function breathLoop() {
      if (isBreathing) {
        time += 0.035;
        const breathScale = 1 + Math.sin(time) * 0.045;
        const haloScale = 1 + Math.sin(time) * 0.12;
        const haloOpacity = 0.35 + Math.sin(time) * 0.18;

        orb.style.transform = `scale(${breathScale})`;
        halo.style.transform = `scale(${haloScale})`;
        halo.style.opacity = haloOpacity.toString();
      }
      requestAnimationFrame(breathLoop);
    }
    requestAnimationFrame(breathLoop);

    // Delight interaction: gently react to touch/tap
    let hintTimeout;
    orb.addEventListener('click', () => {
      isBreathing = false;
      orb.style.transform = 'scale(1.15)';
      halo.style.transform = 'scale(1.4)';
      halo.style.opacity = '0.7';

      if (hint) {
        hint.classList.remove('opacity-0');
        hint.classList.add('opacity-100');
        clearTimeout(hintTimeout);
        hintTimeout = setTimeout(() => {
          hint.classList.remove('opacity-100');
          hint.classList.add('opacity-0');
        }, 3200);
      }

      setTimeout(() => {
        isBreathing = true;
      }, 400);
    });

    if (startBtn) {
      startBtn.addEventListener('click', () => {
        orb.style.transform = 'scale(1.25)';
        halo.style.transform = 'scale(1.6)';
        halo.style.opacity = '0.85';
      });
    }
  })();
</script></main></div></body></html>
