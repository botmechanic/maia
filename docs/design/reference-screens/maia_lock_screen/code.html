<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary": "#774a00", "on-tertiary-container": "#ffecd9", "on-background": "#211a12", "surface-bright": "#fff8f4", "secondary-container": "#d8e8c6", "primary": "#903820", "on-error-container": "#93000a", "secondary-fixed-dim": "#bcccab", "on-tertiary-fixed-variant": "#653e00", "tertiary-fixed": "#ffddb8", "on-surface-variant": "#56423d", "on-secondary-fixed": "#131f0a", "outline-variant": "#dcc0ba", "on-secondary-fixed-variant": "#3d4b32", "on-tertiary": "#ffffff", "background": "#fff8f4", "on-surface": "#211a12", "secondary": "#556348", "on-primary-container": "#ffeae5", "inverse-primary": "#ffb5a1", "primary-container": "#af4f35", "surface-dim": "#e6d8cb", "on-primary-fixed": "#3c0800", "on-secondary-container": "#5a694e", "on-primary-fixed-variant": "#7e2b14", "inverse-surface": "#372f26", "tertiary-container": "#93621b", "on-primary": "#ffffff", "on-tertiary-fixed": "#2a1700", "surface": "#fff8f4", "surface-container-lowest": "#ffffff", "on-secondary": "#ffffff", "error": "#ba1a1a", "inverse-on-surface": "#fdeee1", "primary-fixed-dim": "#ffb5a1", "surface-tint": "#9d4229", "surface-container-low": "#fff1e5", "surface-container": "#faebde", "surface-container-highest": "#eee0d3", "tertiary-fixed-dim": "#fabb6c", "outline": "#89726c", "primary-fixed": "#ffdbd1", "error-container": "#ffdad6", "secondary-fixed": "#d8e8c6", "on-error": "#ffffff", "surface-container-high": "#f4e6d9", "surface-variant": "#eee0d3" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "margin": "1.25rem", "space-xs": "0.25rem", "space-md": "1rem", "gutter": "1rem", "space-xl": "2rem", "space-lg": "1.5rem" }, "fontFamily": { "body-md": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "numeric-metric": ["Plus Jakarta Sans"], "caption": ["Plus Jakarta Sans"] }, "fontSize": { "body-md": ["15px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400" }], "headline-xl-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.025em", "fontWeight": "700" }], "body-lg": ["17px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "400" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-xl": ["34px", { "lineHeight": "42px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "500" }], "numeric-metric": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "caption": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }] } } } }</script><style>@layer base { .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="min-h-full bg-background text-on-surface font-body-md text-body-md antialiased flex flex-col items-center"><div class="w-full max-w-[480px] min-h-screen flex flex-col relative px-margin pt-safe pb-safe"><main class="flex-1 flex flex-col w-full bg-background"><div class="flex flex-col w-full items-center justify-between pb-12 pt-4 min-h-[580px]">
<!-- Top Trust & Telemetry Capsule -->
<div class="w-full flex items-center justify-between px-2">
<div class="flex items-center gap-1.5 py-1 px-3 rounded-full bg-surface-container-high text-on-surface-variant font-caption text-caption">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="tracking-wider uppercase font-semibold text-[11px]">Enclave Active</span>
</div>
<div class="flex items-center gap-1 py-1 px-2.5 rounded-full bg-surface-container-low text-secondary font-caption text-caption">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="text-[11px] font-medium tracking-wide">On-Device Only</span>
</div>
</div>
<!-- Center Focal Security & Identity Chamber -->
<div class="flex flex-col items-center text-center my-auto w-full max-w-sm px-4">
<!-- Glowing Maia Companion Orb -->
<div class="relative flex items-center justify-center mb-8">
<!-- Ambient Radiant Halo Layers -->
<div class="absolute w-32 h-32 rounded-full bg-gradient-to-tr from-primary-fixed to-tertiary-fixed blur-2xl opacity-40 transition-all duration-1000 ease-in-out" id="orb-halo"></div>
<div class="absolute w-20 h-20 rounded-full bg-primary-container blur-md opacity-25"></div>
<!-- Sacred Core Orb -->
<div class="relative w-16 h-16 rounded-full bg-gradient-to-b from-[#E0A458] to-[#AF4F35] shadow-lg flex items-center justify-center cursor-pointer transition-transform duration-300 hover:scale-105 active:scale-95" id="orb-core">
<div class="w-14 h-14 rounded-full bg-gradient-to-tr from-transparent via-surface-bright/20 to-surface-bright/40"></div>
</div>
</div>
<!-- Editorial Hierarchy Titles -->
<h1 class="font-numeric-metric text-numeric-metric text-on-surface tracking-tight mb-2">
      Maia is locked
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 max-w-[260px] leading-relaxed">
      Protected by device biometrics
    </p>
<!-- Interactive Biometric Authentication Sensor Tile -->
<button aria-label="Authenticate with biometrics" class="group flex flex-col items-center justify-center w-full max-w-[280px] p-6 rounded-2xl bg-surface-container-lowest shadow-sm hover:shadow-md transition-all duration-300 active:scale-95 mb-6" id="biometric-btn" type="button">
<div class="relative w-14 h-14 rounded-2xl bg-surface-container flex items-center justify-center text-on-surface mb-3 group-hover:bg-primary-fixed transition-colors duration-200">
<!-- Biometric Pulse Ring (Dynamic) -->
<span class="absolute inset-0 rounded-2xl bg-primary/10 scale-95 opacity-0 transition-all duration-500" id="scan-ring"></span>
<span class="material-symbols-outlined text-[28px] text-on-surface-variant group-hover:text-primary transition-colors">
          face
        </span>
</div>
<span class="font-label-md text-label-md text-on-surface font-semibold mb-1">
        Authenticate
      </span>
<span class="font-caption text-caption text-on-surface-variant text-center leading-normal px-2">
        Tap to authenticate with biometric unlock or passcode
      </span>
</button>
<!-- Primary Affirmative Action Button -->
<button class="w-full max-w-[280px] h-12 rounded-full bg-primary-container text-on-primary font-label-md text-label-md font-semibold tracking-wide shadow-sm hover:brightness-105 active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="primary-unlock-btn" type="button">
<span class="material-symbols-outlined text-[18px]">lock_open</span>
<span>Unlock</span>
</button>
</div>
<!-- Bottom Cryptographic Ledger & Vault Assurance -->
<div class="flex flex-col items-center gap-3 w-full pt-4">
<!-- Cryptographic Badge -->
<div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface-container-low shadow-sm">
<span class="material-symbols-outlined text-[15px] text-secondary">
        verified_user
      </span>
<span class="font-caption text-caption text-on-surface-variant font-medium tracking-tight">
        Encrypted vault · 0 bytes transmitted
      </span>
</div>
<!-- Micro Session Info -->
<p class="font-caption text-caption text-outline/80 text-[11px] tracking-wide">
      Hardware Keystore • Secure Enclave isolated
    </p>
</div>
</div>
<script>
  (function() {
    const biometricBtn = document.getElementById('biometric-btn');
    const unlockBtn = document.getElementById('primary-unlock-btn');
    const scanRing = document.getElementById('scan-ring');
    const orbHalo = document.getElementById('orb-halo');
    const orbCore = document.getElementById('orb-core');

    let isScanning = false;

    function triggerScanFeedback() {
      if (isScanning) return;
      isScanning = true;

      // Animate scan ring
      if (scanRing) {
        scanRing.classList.remove('opacity-0', 'scale-95');
        scanRing.classList.add('opacity-100', 'scale-110');
      }

      // Elevate aura respiration
      if (orbHalo) {
        orbHalo.classList.add('scale-125', 'opacity-70');
      }

      // Gentle haptic-style nudge animation on core
      if (orbCore) {
        orbCore.classList.add('scale-110');
      }

      setTimeout(() => {
        if (scanRing) {
          scanRing.classList.remove('opacity-100', 'scale-110');
          scanRing.classList.add('opacity-0', 'scale-95');
        }
        if (orbHalo) {
          orbHalo.classList.remove('scale-125', 'opacity-70');
        }
        if (orbCore) {
          orbCore.classList.remove('scale-110');
        }
        isScanning = false;
      }, 900);
    }

    if (biometricBtn) {
      biometricBtn.addEventListener('click', triggerScanFeedback);
    }
    if (unlockBtn) {
      unlockBtn.addEventListener('click', triggerScanFeedback);
    }
    if (orbCore) {
      orbCore.addEventListener('click', triggerScanFeedback);
    }
  })();
</script></main></div></body></html>
